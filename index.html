<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trail Angels — Schedule Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --pink: #E8318A; --navy: #2D3561; --orange: #F6A623; --teal: #2ECC8E; --blue: #3B82F6; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: #e8e8e8; color: #1a1a1a; }
.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar { width: 520px; min-width: 520px; background: #fff; display: flex; flex-direction: column; border-right: 1px solid #ddd; height: 100vh; overflow: hidden; }
.sidebar-header { background: var(--navy); padding: 16px 22px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.sidebar-logo { width: 42px; height: 38px; display: flex; align-items: center; justify-content: center; }
.sidebar-logo img { width: 42px; height: auto; }
.sidebar-header h1 { color: #fff; font-size: 15px; font-weight: 700; }
.sidebar-header p { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 1px; }
.sidebar-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
.sidebar-footer { padding: 14px 22px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

.sec-label { font-size: 10px; font-weight: 700; color: var(--pink); letter-spacing: 1.2px; text-transform: uppercase; margin: 18px 0 9px; }
.sec-label:first-child { margin-top: 0; }
label { display: block; font-size: 11px; font-weight: 600; color: #666; margin-bottom: 3px; }
input[type="text"], input[type="date"], input[type="password"], select {
  width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
  font-size: 13px; font-family: 'Inter', sans-serif; color: #1a1a1a; background: #fafafa;
  outline: none; transition: border-color 0.15s; -webkit-appearance: auto; appearance: auto;
}
input:focus, select:focus { border-color: var(--pink); background: #fff; }
.field { margin-bottom: 10px; }
.row2 { display: flex; gap: 10px; }
.row2 .field { flex: 1; min-width: 0; }

.day-group { margin-bottom: 6px; border-radius: 8px; overflow: hidden; border: 1px solid #e5e5e5; }
.day-group-header { display: flex; align-items: center; gap: 8px; background: var(--navy); color: #fff; padding: 9px 14px; cursor: pointer; user-select: none; }
.day-group-name { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
.day-group-date { font-size: 11px; color: rgba(255,255,255,0.5); }
.day-session-count { margin-left: auto; background: rgba(255,255,255,0.15); border-radius: 10px; padding: 1px 7px; font-size: 10px; font-weight: 600; }
.day-chevron { font-size: 10px; color: rgba(255,255,255,0.55); margin-left: 4px; transition: transform 0.15s; display: inline-block; }
.day-group.collapsed .day-chevron { transform: rotate(-90deg); }
.day-group-body { background: #f9f9f9; }
.day-group.collapsed .day-group-body { display: none; }

.ride-card { border-bottom: 1px solid #efefef; background: #fff; }
.ride-card:last-child { border-bottom: none; }
.ride-card-header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; user-select: none; }
.ride-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #ccc; }
.ride-card-name { font-size: 12px; font-weight: 600; color: #2a2a2a; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride-card-time { font-size: 11px; color: #aaa; flex-shrink: 0; }
.ride-remove { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 0 3px; line-height: 1; flex-shrink: 0; }
.ride-remove:hover { color: var(--pink); }
.ride-chevron { font-size: 10px; color: #ccc; transition: transform 0.15s; display: inline-block; flex-shrink: 0; }
.ride-card.collapsed .ride-chevron { transform: rotate(-90deg); }
.ride-card-body { padding: 12px 14px 14px; border-top: 1px solid #f0f0f0; }
.ride-card.collapsed .ride-card-body { display: none; }

.add-session-panel { margin-top: 8px; border: 1.5px solid var(--pink); border-radius: 9px; overflow: hidden; }
.add-session-header { background: #fef0f6; padding: 10px 14px; border-bottom: 1px solid #f5c6de; }
.add-session-header span { font-size: 12px; font-weight: 700; color: var(--pink); }
.add-session-body { padding: 12px 14px 14px; background: #fff; }
.btn-confirm-add { width: 100%; padding: 10px; background: var(--pink); border: none; border-radius: 7px; color: #fff; font-size: 13px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 4px; }
.btn-confirm-add:hover { background: #c8257a; }
.btn-cancel-add { width: 100%; padding: 8px; background: none; border: 1px solid #ddd; border-radius: 7px; color: #888; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 6px; }
.btn-open-add { width: 100%; padding: 10px; background: none; border: 1.5px dashed var(--pink); border-radius: 7px; color: var(--pink); font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 8px; }
.btn-open-add:hover { background: #fef0f6; }

.format-toggle { display: flex; gap: 6px; margin-bottom: 2px; }
.fmt-btn { flex: 1; padding: 9px 6px; background: #f0f0f0; border: 1.5px solid #ddd; border-radius: 8px; color: #666; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.15s; }
.fmt-btn:hover { border-color: var(--pink); color: var(--pink); }
.fmt-btn.active { background: #fef0f6; border-color: var(--pink); color: var(--pink); }
.btn-preview { padding: 13px; background: var(--pink); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; width: 100%; }
.btn-preview:hover { background: #c8257a; }
.btn-dl { padding: 11px; background: var(--navy); border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; width: 100%; }
.btn-dl:hover { background: #1e254a; }
.btn-canva { padding: 11px; background: #7D2AE8; border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px; }
.btn-canva:hover { background: #6620c8; }
.btn-canva svg { width: 16px; height: 16px; flex-shrink: 0; }
.canva-status { font-size: 11px; color: #888; text-align: center; min-height: 16px; }

.admin-section { margin-top: 16px; border-top: 1px solid #eee; padding-top: 14px; }
.admin-toggle { background: none; border: none; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: var(--navy); cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 0; }
.admin-toggle::after { content: '▾'; }
.admin-toggle.open::after { content: '▴'; }
.admin-body { display: none; margin-top: 10px; }
.admin-body.open { display: block; }
.admin-box { background: #f0f4ff; border: 1px solid #c5d0f0; border-radius: 7px; padding: 12px; }
.admin-item { display: flex; align-items: center; gap: 6px; padding: 5px 0; font-size: 11px; border-bottom: 1px solid #dde4f8; }
.admin-item:last-child { border-bottom: none; }
.tag { display: inline-block; padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: 700; }
.tag-MTB { background: #fde0ee; color: #8b1a52; }
.tag-Gravel { background: #fef3d0; color: #7a5100; }
.tag-Skills { background: #dbeafe; color: #1e3a8a; }
.tag-Hike { background: #d1fae5; color: #064e3b; }
.admin-error { color: var(--pink); font-size: 11px; margin-top: 5px; display: none; }
.btn-sm { padding: 6px 12px; border: none; border-radius: 5px; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; }

.preview-pane { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 28px 32px; overflow: hidden; background: #e0e0e0; position: relative; }
.preview-top { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 14px; }
.preview-lbl { font-size: 10px; font-weight: 700; color: #999; letter-spacing: 1px; text-transform: uppercase; }
.zoom-controls { display: flex; align-items: center; gap: 8px; }
.zoom-btn { background: #fff; border: 1px solid #ddd; border-radius: 6px; width: 28px; height: 28px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; font-weight: 600; line-height: 1; user-select: none; }
.zoom-btn:hover { background: #f5f5f5; border-color: #bbb; }
.zoom-pct { font-size: 11px; font-weight: 600; color: #777; min-width: 36px; text-align: center; }
#previewViewport { flex: 1; width: 100%; overflow: auto; display: flex; align-items: flex-start; justify-content: center; cursor: grab; }
#previewViewport:active { cursor: grabbing; }
#canvasWrap { border-radius: 10px; overflow: hidden; box-shadow: 0 8px 36px rgba(0,0,0,0.2); flex-shrink: 0; transform-origin: top center; transition: transform 0.15s ease; }
#scheduleCanvas { display: block; width: 400px; height: auto; }

@media (max-width: 900px) {
  .app { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
  .sidebar { width: 100%; min-width: 0; height: auto; overflow: visible; border-right: none; border-bottom: 1px solid #ddd; }
  .sidebar-body { overflow: visible; padding: 16px; }
  .sidebar-footer { padding: 12px 16px; }
  .preview-pane { padding: 20px 16px 32px; flex: none; overflow: visible; }
  #previewViewport { overflow: visible; }
  #canvasWrap { max-width: 100%; }
  #scheduleCanvas { width: 100%; }
  .btn-preview, .btn-dl { font-size: 15px; padding: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><img id="taLogoImg" src="" alt="Trail Angels"></div>
      <div><h1>Schedule Builder</h1><p>Trail Angels Weekly</p></div>
    </div>
    <div class="sidebar-body">
      <div class="sec-label">Week</div>
      <div class="row2">
        <div class="field"><label>Start (Mon)</label><input type="date" id="startDate" oninput="onStartChange()"></div>
        <div class="field"><label>End (Sun)</label><input type="date" id="endDate" readonly style="background:#f0f0f0;color:#999;"></div>
      </div>
      <div class="field"><label>Tagline</label><input type="text" id="tagline" value="Your trail family is waiting." oninput="render()"></div>

      <div class="sec-label">Sessions</div>
      <div id="dayGroups"></div>

      <div id="addSessionOpen" style="display:none;">
        <div class="add-session-panel">
          <div class="add-session-header"><span>+ New session</span></div>
          <div class="add-session-body">
            <div class="field"><label>Day</label>
              <select id="newDay"><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select>
            </div>
            <div class="field"><label>Ride / session</label>
              <select id="newRide" onchange="onNewRidePick()"><option value="-1">— choose —</option></select>
            </div>
            <div class="row2">
              <div class="field"><label>Time</label><input type="text" id="newTime" placeholder="8:30am – 10:30am"></div>
              <div class="field"><label>Location</label><input type="text" id="newLoc" placeholder="Tokai Picnic Area"></div>
            </div>
            <button class="btn-confirm-add" onclick="confirmAdd()">Add to schedule</button>
            <button class="btn-cancel-add" onclick="closeAddPanel()">Cancel</button>
          </div>
        </div>
      </div>
      <button class="btn-open-add" id="addSessionBtn" onclick="openAddPanel()">+ Add session</button>

      <div class="admin-section">
        <button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()">⚙ Manage ride types</button>
        <div class="admin-body" id="adminBody">
          <div class="admin-box">
            <div id="adminLock">
              <div class="field"><label>Admin code</label><input type="password" id="adminCode" placeholder="Enter code" onkeydown="if(event.key==='Enter')checkCode()"></div>
              <button class="btn-sm" style="background:var(--navy);color:#fff;" onclick="checkCode()">Unlock</button>
              <div class="admin-error" id="adminError">Incorrect code</div>
            </div>
            <div id="adminPanel" style="display:none;">
              <div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px;">Current ride types</div>
              <div id="adminList"></div>
              <div style="font-size:11px;font-weight:700;color:var(--navy);margin:10px 0 6px;">Add new</div>
              <div class="field"><label>Name</label><input type="text" id="nName" placeholder="e.g. Sunrise Ride"></div>
              <div class="row2">
                <div class="field"><label>Type</label><select id="nType"><option>MTB</option><option>Gravel</option><option>Skills</option><option>Hike</option></select></div>
                <div class="field"><label>Default time</label><input type="text" id="nTime" placeholder="8am – 10am"></div>
              </div>
              <div class="field"><label>Location</label><input type="text" id="nLoc" placeholder="Tokai Picnic Area"></div>
              <div class="field"><label>Sub-label</label><input type="text" id="nSub" placeholder="All riders welcome"></div>
              <button class="btn-sm" style="background:var(--pink);color:#fff;width:100%;margin-top:4px;" onclick="addRideType()">Add ride type</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="format-toggle">
        <button class="fmt-btn active" id="fmtPost" onclick="setFormat('post')">📱 Post (3:4)</button>
        <button class="fmt-btn" id="fmtStory" onclick="setFormat('story')">📲 Story (9:16)</button>
      </div>
      <button class="btn-preview" onclick="render()">Preview schedule</button>
      <button class="btn-dl" onclick="download()">Download PNG</button>
      <button class="btn-canva" onclick="exportToCanva()">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
        Export to Canva
      </button>
      <div class="canva-status" id="canvaStatus"></div>
    </div>
  </aside>

  <main class="preview-pane">
    <div class="preview-top">
      <div class="preview-lbl" id="previewLbl">Live preview — 3 : 4</div>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoom(-0.15)">−</button>
        <span class="zoom-pct" id="zoomPct">100%</span>
        <button class="zoom-btn" onclick="zoom(+0.15)">+</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Fit" style="font-size:11px;width:36px;">Fit</button>
      </div>
    </div>
    <div id="previewViewport">
      <div id="canvasWrap"><canvas id="scheduleCanvas"></canvas></div>
    </div>
  </main>
</div>

// Always work in LOCAL time — never use toISOString() which converts to UTC
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function parseLocalDate(iso) {
  // Parse YYYY-MM-DD as local midnight, not UTC midnight
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getNextMonday() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const day = today.getDay(); // 0=Sun, 1=Mon … 6=Sat
  // Days until next Monday (if today is Monday, jump to next week's Monday)
  const diff = day === 1 ? 7 : (8 - day) % 7;
  const mon = new Date(today);
  mon.setDate(today.getDate() + diff);
  return mon;
}

function snapToMonday(iso) {
  const d = parseLocalDate(iso);
  const day = d.getDay(); // 0=Sun, 1=Mon … 6=Sat
  const diff = day === 0 ? -6 : 1 - day; // shift back to Monday
  d.setDate(d.getDate() + diff);
  return d;
}
function initDates() {
  const mon = getNextMonday(), sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  document.getElementById('startDate').value = toISO(mon);
  document.getElementById('endDate').value = toISO(sun);
}
function onStartChange() {
  const val = document.getElementById('startDate').value; if (!val) return;
  const mon = snapToMonday(val), sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  document.getElementById('startDate').value = toISO(mon);
  document.getElementById('endDate').value = toISO(sun);
  rebuildUI(); render();
}
function dateForDay(dayName) {
  const iso = document.getElementById('startDate').value; if (!iso) return '';
  const start = parseLocalDate(iso);
  const d = new Date(start);
  d.setDate(start.getDate() + DAYS.indexOf(dayName));
  return d.getDate();
}

function formatRange(s, e) {
  if (!s || !e) return '';
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const sd = parseLocalDate(s), ed = parseLocalDate(e);
  if (sd.getMonth() === ed.getMonth() && sd.getFullYear() === ed.getFullYear())
    return `${sd.getDate()} – ${ed.getDate()} ${M[sd.getMonth()]} ${sd.getFullYear()}`;
  return `${sd.getDate()} ${M[sd.getMonth()]} – ${ed.getDate()} ${M[ed.getMonth()]} ${ed.getFullYear()}`;
}

function parseTime(s) {
  if (!s) return 9999;
  const m = s.match(/(\d+)(?::(\d+))?\s*(am|pm)/i); if (!m) return 9999;
  let h = parseInt(m[1]), min = parseInt(m[2]||'0'), ap = m[3].toLowerCase();
  if (ap==='pm' && h!==12) h+=12; if (ap==='am' && h===12) h=0;
  return h*60+min;
}
function sortEntries() {
  entries.sort((a,b) => {
    const di = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
    return di !== 0 ? di : parseTime(a.time) - parseTime(b.time);
  });
}
function removeEntry(id) { entries = entries.filter(e => e.id!==id); rebuildUI(); render(); }

// Draw a proper parametric heart centred at cx,cy with given pixel height
function drawHeart(ctx, cx, cy, heartH, fillColor) {
  ctx.save();
  ctx.translate(cx, cy);
  const scale = heartH / 32; // unit heart spans ~32 units tall
  ctx.beginPath();
  // Parametric heart: x=16sin³t, y=-(13cost-5cos2t-2cos3t-cos4t)
  for (let i = 0; i <= 360; i++) {
    const t = (i * Math.PI) / 180;
    const x = 16 * Math.pow(Math.sin(t), 3) * scale;
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) * scale;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.restore();
}

let currentFormat = 'post'; // 'post' = 3:4 (900×1200) | 'story' = 9:16 (1080×1920)

function setFormat(fmt) {
  currentFormat = fmt;
  document.getElementById('fmtPost').classList.toggle('active', fmt === 'post');
  document.getElementById('fmtStory').classList.toggle('active', fmt === 'story');
  document.getElementById('previewLbl').textContent = fmt === 'post' ? 'Live preview — 3 : 4 Post (1080×1440)' : 'Live preview — 9 : 16 Story (1080×1920)';
  render();
}

function render() {
  const canvas = document.getElementById('scheduleCanvas');
  const ctx = canvas.getContext('2d');
  // Post: 1080×1440 (3:4 at proper Instagram resolution)
  // Story: 1080×1920 (9:16, already correct)
  const CW = 1080;
  const CH = currentFormat === 'story' ? 1920 : 1440;
  canvas.width = CW; canvas.height = CH;
  // Keep display width fixed at 400px; height scales with ratio
  canvas.style.width = '400px';
  canvas.style.height = 'auto';

  const sessionData = entries.map(e => {
    const rt = e.rideTypeIdx>=0 ? rideTypes[e.rideTypeIdx] : null;
    if (!rt) return null;
    return { day:e.day, name:rt.name, type:rt.type, sub:rt.sub, time:e.time, location:e.location };
  }).filter(Boolean);

  const grouped = DAYS
    .filter(d => sessionData.some(s=>s.day===d))
    .map(d => ({ day:d, sessions:sessionData.filter(s=>s.day===d) }));

  const startISO  = document.getElementById('startDate').value;
  const endISO    = document.getElementById('endDate').value;
  const tagline   = document.getElementById('tagline').value || 'Your trail family is waiting.';
  const dateRange = formatRange(startISO, endISO);

  // ── COLOURS — matching reference exactly
  const BG         = '#000000';           // flat black
  const PINK       = '#E8318A';
  const ORANGE     = '#F6A623';
  const BLUE       = '#3B82F6';
  const TEAL       = '#2ECC8E';
  const WHITE      = '#ffffff';
  const NAVY       = '#2D3561';
  // Card: pure white, solid
  const CARD_BG    = '#ffffff';
  const CARD_STROKE= '#e8e8e8';
  // Day column: blush pink flat (the left block in the reference)
  const DAY_BG     = '#F7C5D8';           // warm pink blush matching reference
  const DAY_TEXT   = '#ffffff';           // white text for day name
  const RIDE_NAME  = '#2D3561';           // navy ride name
  const SUB_COL    = '#666666';           // sub-label
  const TIME_COL   = '#2D3561';           // navy time
  const LOC_COL    = '#666666';           // location
  const TC         = { MTB:PINK, Gravel:ORANGE, Skills:BLUE, Hike:TEAL };

  // ── helpers
  const rrect = (x,y,w,h,r,fill,stroke,lw) => {
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
  };
  const circ = (cx,cy,r,fill) => { ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill(); };
  const txt  = (s,x,y,font,color,align,base) => {
    ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align||'left';
    ctx.textBaseline=base||'alphabetic'; ctx.fillText(s,x,y);
  };

  const isStory = currentFormat === 'story';

  // ── LAYOUT CONSTANTS
  // Layout baseline is always 900px wide for Post proportions
  // Both formats are now 1080px wide so scale accordingly
  const wScale     = CW / 900;
  const PAD_X_N    = 150 * wScale;
  // Story: 110px wide day col; Post: 188px
  const DAY_COL_N  = isStory ? 110 * wScale : 188 * wScale;
  // Base row height — story gets more room per row to accommodate wrapping
  const ENTRY_H_N  = isStory ? 120 : 92;
  const CARD_PAD_N = isStory ? 14 : 10;
  const CARD_GAP_N = isStory ? 32 : 20;
  const HEADER_H_N = isStory ? 340 : 260;
  const FOOTER_H_N = isStory ? 220 : 140;

  // ── FONT SIZES — story gets larger text for readability
  const RIDE_FS    = isStory ? 28 : 21;
  const SUB_FS     = isStory ? 22 : 17;
  const LOC_FS     = isStory ? 21 : 16;

  // Helper: measure and wrap text into lines that fit maxW
  function wrapText(context, text, maxW, font) {
    context.font = font;
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (context.measureText(test).width > maxW && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // ── MEASURE: for each group, figure out actual card height accounting for wrapping
  // We need PAD_X and DAY_COL to do this, so compute scale iteratively:
  // First pass with scale=1 to get natural height
  const S1 = v => v; // scale=1 pass
  const CONTENT_W_NATURAL = CW - PAD_X_N*2 - DAY_COL_N - 20 - 20; // content area width

  function measureCardH(sessions, sc) {
    const entryH_base = ENTRY_H_N * sc;
    const subFont  = `${Math.max(10, Math.round(SUB_FS * sc))}px Inter, Arial`;
    const locFont  = `${Math.max(10, Math.round(LOC_FS * sc))}px Inter, Arial`;
    const contentW = (CW - (PAD_X_N*wScale)*2 - (DAY_COL_N)*1 - 20*sc - 20*sc) * sc / sc;
    // approximate: just use natural widths for wrap detection
    const availW = CONTENT_W_NATURAL * 0.45; // left half for sub, right half for loc
    let totalH = CARD_PAD_N * 2;
    sessions.forEach(s => {
      const subLines = wrapText(ctx, s.sub||'', availW, subFont);
      const locLines = wrapText(ctx, s.location||'', availW, locFont);
      const extraLines = Math.max(0, subLines.length - 1, locLines.length - 1);
      totalH += entryH_base + extraLines * (SUB_FS * sc + 4);
    });
    return totalH;
  }

  const naturalH = HEADER_H_N + grouped.reduce((a,g) => a + measureCardH(g.sessions, 1) + CARD_GAP_N, 0) + FOOTER_H_N;
  const scale = Math.min(1, CH / naturalH);
  const S = v => v * scale;

  const PAD_X    = S(PAD_X_N);
  const CARD_W   = CW - PAD_X*2;
  const DAY_COL  = S(DAY_COL_N);
  const CARD_PAD = S(CARD_PAD_N);
  const CARD_GAP = S(CARD_GAP_N);
  const HEADER_H = S(HEADER_H_N);
  const FOOTER_H = S(FOOTER_H_N);

  const fs  = b => `${Math.max(10, Math.round(b*scale))}px Inter, Arial`;
  const fsB = b => `bold ${Math.max(10, Math.round(b*scale))}px Inter, Arial`;
  const fs9 = b => `900 ${Math.max(10, Math.round(b*scale))}px Inter, Arial`;

  // ── BACKGROUND: flat black
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, CW, CH);

  // ── HEADER — logo + title + tags, vertically centred within HEADER_H zone
  const logoH    = S(80);
  const logoW    = logoH * (taLogoImage.naturalWidth / (taLogoImage.naturalHeight || 1));
  const heartGap = S(22);
  const titleFont = fs9(52);
  ctx.font = titleFont;
  const titleW  = ctx.measureText('WEEKLY SCHEDULE').width;
  const blockW  = logoW + heartGap + titleW;
  const blockLeft = (CW - blockW) / 2;

  // Tags dimensions
  const tags=[{l:'MTB',c:PINK},{l:'GRAVEL',c:ORANGE},{l:'SKILLS',c:BLUE},{l:'HIKE',c:TEAL}];
  const TW=S(110), TH=S(34), TGAP=S(12);
  const totalTagW = tags.length*TW + (tags.length-1)*TGAP;
  const tagGapAbove = S(18);

  // Total height of header content block
  const headerContentH = Math.max(logoH, S(52)) + tagGapAbove + TH;
  // Vertically centre that block within HEADER_H
  const headerTop = (HEADER_H - headerContentH) / 2;
  // Centre of the logo+title row
  const headerRowCY = headerTop + Math.max(logoH, S(52)) / 2;

  // Draw logo image
  const logoCX = blockLeft + logoW / 2;
  if (taLogoImage.complete && taLogoImage.naturalWidth > 0) {
    ctx.drawImage(taLogoImage, blockLeft, headerTop, logoW, logoH);
  } else {
    drawHeart(ctx, logoCX, headerRowCY, logoH, PINK);
  }

  const titleX = blockLeft + logoW + heartGap;
  txt('WEEKLY SCHEDULE', titleX, headerRowCY, titleFont, WHITE, 'left', 'middle');

  // Tags — centred under the title text
  const tagBlockLeft = titleX + (titleW - totalTagW) / 2;
  let tx = tagBlockLeft;
  const TY = headerTop + Math.max(logoH, S(52)) + tagGapAbove;
  tags.forEach(t => {
    rrect(tx, TY, TW, TH, TH/2, t.c);
    txt(t.l, tx+TW/2, TY+TH/2, fsB(15), WHITE, 'center', 'middle');
    tx += TW + TGAP;
  });


  // ── CARDS
  let yPos = HEADER_H;

  grouped.forEach(group => {
    const dateNum   = dateForDay(group.day);
    const CONTENT_X = PAD_X + DAY_COL + S(20);
    const RIGHT_X   = PAD_X + CARD_W  - S(20);
    const availSubW = (RIGHT_X - CONTENT_X) * 0.5 - S(8);
    const availLocW = (RIGHT_X - CONTENT_X) * 0.5 - S(8);
    const lineH     = S(SUB_FS) + S(4);

    // Pre-measure each session to get row heights (may be taller if text wraps)
    const sessionMeta = group.sessions.map(s => {
      const subLines = isStory ? wrapText(ctx, s.sub||'',      availSubW, fs(SUB_FS)) : [s.sub||''];
      const locLines = isStory ? wrapText(ctx, s.location||'', availLocW, fs(LOC_FS)) : [s.location||''];
      const extraLines = Math.max(0, subLines.length - 1, locLines.length - 1);
      const rowH = S(ENTRY_H_N) + extraLines * lineH;
      return { subLines, locLines, rowH };
    });

    const CH_c = CARD_PAD*2 + sessionMeta.reduce((a,m) => a + m.rowH, 0);

    // White card
    rrect(PAD_X, yPos, CARD_W, CH_c, S(20), CARD_BG, CARD_STROKE, 1);

    // Blush day column with proper rounded left corners
    ctx.save();
    ctx.beginPath();
    const r = S(20);
    ctx.moveTo(PAD_X + r, yPos);
    ctx.lineTo(PAD_X + DAY_COL, yPos);
    ctx.lineTo(PAD_X + DAY_COL, yPos + CH_c);
    ctx.lineTo(PAD_X + r, yPos + CH_c);
    ctx.quadraticCurveTo(PAD_X, yPos + CH_c, PAD_X, yPos + CH_c - r);
    ctx.lineTo(PAD_X, yPos + r);
    ctx.quadraticCurveTo(PAD_X, yPos, PAD_X + r, yPos);
    ctx.closePath();
    ctx.fillStyle = DAY_BG;
    ctx.fill();
    ctx.restore();

    // Day name + date — always centred in day col
    const dayCX = PAD_X + DAY_COL/2;
    const dayCY = yPos + CH_c/2;
    if (isStory) {
      // Story: full day name + date stacked, both centred
      txt(group.day.toUpperCase(), dayCX, dayCY - S(16), fsB(22), DAY_TEXT, 'center', 'middle');
      txt(String(dateNum),         dayCX, dayCY + S(16), fsB(22), PINK,     'center', 'middle');
    } else {
      txt(group.day.toUpperCase(), dayCX, dayCY - S(14), fsB(20), DAY_TEXT, 'center', 'middle');
      txt(String(dateNum),         dayCX, dayCY + S(14), fsB(24), PINK,     'center', 'middle');
    }

    // Separator line
    ctx.strokeStyle = '#e0c8d4'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD_X + DAY_COL, yPos + S(8));
    ctx.lineTo(PAD_X + DAY_COL, yPos + CH_c - S(8));
    ctx.stroke();

    // Sessions
    let rowTop = yPos + CARD_PAD;

    group.sessions.forEach((s, i) => {
      const meta   = sessionMeta[i];
      const rowH   = meta.rowH;
      const rowCY  = rowTop + rowH / 2;

      if (i > 0) {
        ctx.strokeStyle = '#eeeeee'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(CONTENT_X, rowTop); ctx.lineTo(RIGHT_X, rowTop); ctx.stroke();
      }

      const DOT_R     = isStory ? S(10) : S(8);
      const DOT_X     = CONTENT_X + S(10);
      const TEXT_X    = DOT_X + DOT_R + S(12);
      const typeColor = TC[s.type] || PINK;

      // Title and time always share the same font size
      const titleCY = rowCY - S(10);
      circ(DOT_X, titleCY, DOT_R, typeColor);
      txt(s.name, TEXT_X,  titleCY, fsB(RIDE_FS), RIDE_NAME, 'left',  'middle');
      txt(s.time, RIGHT_X, titleCY, fsB(RIDE_FS), TIME_COL,  'right', 'middle');

      // Sub-label — single line (post) or wrapped (story)
      const subY0 = rowCY + S(14);
      meta.subLines.forEach((line, li) => {
        txt(line, TEXT_X, subY0 + li * lineH, fs(SUB_FS), SUB_COL, 'left', 'middle');
      });

      // Location — right-aligned, wrapped in story
      const locY0 = subY0;
      meta.locLines.forEach((line, li) => {
        txt(line, RIGHT_X, locY0 + li * lineH, fs(LOC_FS), LOC_COL, 'right', 'middle');
      });

      rowTop += rowH;
    });

    yPos += CH_c + CARD_GAP;
  });

  // ── FOOTER — vertically centre content in the space below last card
  // Footer content: dateRange line + divider + tagline
  // Total content height: line spacing between date and tagline = S(68)
  const footerContentH = S(28) + S(30) + S(2) + S(28); // date text + gap to line + line + gap to tagline + tagline
  // Space available = CH - yPos (from end of last card to bottom of canvas)
  const footerSpace = CH - yPos;
  const footerContentTop = yPos + (footerSpace - S(68) - S(28)) / 2;
  const footerCY = footerContentTop + S(14); // centre of date text

  txt(dateRange, CW/2, footerCY, fsB(28), WHITE, 'center', 'middle');
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = S(1.5);
  ctx.beginPath();
  ctx.moveTo(CW/2 - S(140), footerCY + S(30));
  ctx.lineTo(CW/2 + S(140), footerCY + S(30));
  ctx.stroke();
  txt(tagline, CW/2, footerCY + S(68), fsB(28), WHITE, 'center', 'middle');
}

// ── DOWNLOAD ──────────────────────────────────────────────────────────────
function download() {
  render();
  setTimeout(() => {
    const canvas = document.getElementById('scheduleCanvas');
    const dataURL = canvas.toDataURL('image/png');
    if (navigator.canShare && navigator.share) {
      canvas.toBlob(blob => {
        const fname = currentFormat === 'story' ? 'trail-angels-story.png' : 'trail-angels-post.png';
    const file = new File([blob], fname, {type:'image/png'});
        if (navigator.canShare({files:[file]})) {
          navigator.share({files:[file],title:'Trail Angels Schedule'}).catch(()=>fallbackDownload(dataURL));
          return;
        }
        fallbackDownload(dataURL);
      },'image/png');
    } else { fallbackDownload(dataURL); }
  }, 150);
}
function fallbackDownload(dataURL) {
  const a = document.createElement('a');
  a.download = currentFormat === 'story' ? 'trail-angels-story.png' : 'trail-angels-post.png';
  a.href = dataURL; a.click();
}

// ── CANVA EXPORT ──────────────────────────────────────────────────────────
async function exportToCanva() {
  const btn = document.querySelector('.btn-canva');
  const status = document.getElementById('canvaStatus');
  try {
    render();
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    status.textContent = 'Generating image…';

    const canvas = document.getElementById('scheduleCanvas');
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const fname = currentFormat === 'story' ? 'trail-angels-story.png' : 'trail-angels-post.png';

    // Convert blob to base64
    const reader = new FileReader();
    const base64 = await new Promise((res, rej) => {
      reader.onload = e => res(e.target.result);
      reader.onerror = rej;
      reader.readAsDataURL(blob);
    });

    status.textContent = 'Sending to Canva…';

    // Use Claude's Canva MCP to upload and create a design
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        mcp_servers: [{ type: 'url', url: 'https://mcp.canva.com/mcp', name: 'canva' }],
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: 'image/png', data: base64.split(',')[1] }
            },
            {
              type: 'text',
              text: `Upload this image as an asset to Canva with the name "${fname}", then create a new design using it. The design should be ${currentFormat === 'story' ? '1080x1920 (Story format)' : '900x1200 (Post format)'} with this image placed filling the canvas. Return the URL of the created design.`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    // Extract any URLs from the response
    const allText = data.content.map(b => b.text || '').join(' ');
    const urlMatch = allText.match(/https:\/\/www\.canva\.com\/design\/[^\s"')]+/);

    if (urlMatch) {
      status.innerHTML = `✓ <a href="${urlMatch[0]}" target="_blank" style="color:#7D2AE8;font-weight:600;">Open in Canva →</a>`;
    } else {
      status.textContent = '✓ Uploaded — check your Canva assets';
    }
  } catch (err) {
    console.error(err);
    status.textContent = '⚠ Export failed — try Download PNG instead';
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="white" width="16" height="16"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg> Export to Canva`;
  }
}

// ── ZOOM ──────────────────────────────────────────────────────────────────
let zoomLevel = 1.0;

function applyZoom() {
  const wrap = document.getElementById('canvasWrap');
  wrap.style.transform = `scale(${zoomLevel})`;
  wrap.style.transformOrigin = 'top center';
  document.getElementById('zoomPct').textContent = Math.round(zoomLevel * 100) + '%';
  // Adjust the viewport height so scrolling works correctly at high zoom
  const viewport = document.getElementById('previewViewport');
  const canvas = document.getElementById('scheduleCanvas');
  const scaledH = canvas.offsetHeight * zoomLevel;
  viewport.style.minHeight = (scaledH + 40) + 'px';
}

function zoom(delta) {
  zoomLevel = Math.min(3, Math.max(0.3, zoomLevel + delta));
  applyZoom();
}

function resetZoom() {
  zoomLevel = 1.0;
  applyZoom();
}

// Scroll-wheel zoom in preview viewport
document.getElementById('previewViewport').addEventListener('wheel', function(e) {
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > 10) {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    zoomLevel = Math.min(3, Math.max(0.3, zoomLevel + delta));
    applyZoom();
  }
}, { passive: false });

// Pinch-to-zoom on touch devices
let lastPinchDist = null;
document.getElementById('previewViewport').addEventListener('touchmove', function(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastPinchDist !== null) {
      const delta = (dist - lastPinchDist) * 0.005;
      zoomLevel = Math.min(3, Math.max(0.3, zoomLevel + delta));
      applyZoom();
    }
    lastPinchDist = dist;
  }
}, { passive: false });
document.getElementById('previewViewport').addEventListener('touchend', () => { lastPinchDist = null; });
</script>
